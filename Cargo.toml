[workspace]
resolver = "2"
members = ["crates/core", "crates/native-bridge"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
rusqlite = { version = "=0.40.1", features = ["bundled"] }
sha2 = "=0.10.9"
fs2 = "=0.4.3"
unicode-normalization = "=0.1.24"
