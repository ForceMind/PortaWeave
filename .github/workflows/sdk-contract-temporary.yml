name: Temporary FSKit SDK contract inventory (no mount)
on:
  push:
    branches: [codex/m0k-fskit-bridge]
permissions:
  contents: read
jobs:
  sdk-contract:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public SDK declarations without installation or activation
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          export PW_SDK_ROOT="$(xcrun --sdk macosx --show-sdk-path)"
          python3 - <<'PY'
          import os,pathlib,re
          root=pathlib.Path(os.environ['PW_SDK_ROOT'])/'System/Library/Frameworks/FSKit.framework/Headers'
          for path in sorted(root.glob('*.h')):
              if any(word in path.name for word in ['Volume','Item','FileName','FileData','Directory','Types','Resource','Task']):
                  print('PW_SDK_HEADER_BEGIN '+path.name)
                  code=re.sub(r'/\*.*?\*/','',path.read_text(),flags=re.S)
                  code=re.sub(r'//[^\n]*','',code)
                  print('\n'.join(line for line in code.splitlines() if line.strip()))
                  print('PW_SDK_HEADER_END '+path.name)
          PY

  cloud-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned compiler and locked offline dependencies for the Work Linux workspace
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          cargo +1.99.1 fetch --locked
          mkdir -p "$RUNNER_TEMP/portaweave-cloud-tools"
          toolchain_path="$(rustc +1.99.1 --print sysroot)"
          tar -I 'zstd -T0 -3' -cf "$RUNNER_TEMP/portaweave-cloud-tools/toolchain.tar.zst" -C "$toolchain_path" .
          tar -I 'zstd -T0 -3' -cf "$RUNNER_TEMP/portaweave-cloud-tools/registry.tar.zst" -C "$HOME/.cargo" registry
          cd "$RUNNER_TEMP/portaweave-cloud-tools"
          sha256sum toolchain.tar.zst registry.tar.zst > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: portaweave-cloud-rust-1.99.1
          path: ${{ runner.temp }}/portaweave-cloud-tools/*
          compression-level: 0
