name: TEMPORARY branch-local Rust formatting (remove before merge)
on:
  push:
    branches: [codex/m0-native-abi-20261024]
permissions:
  contents: read
jobs:
  source-format:
    if: "!startsWith(github.event.head_commit.message, 'style(native): rustfmt generated files')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/m0-native-abi-20261024
      - name: Check exact expected branch and format Rust source
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/codex/m0-native-abi-20261024"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          cargo +1.99.1 fmt --all
          git diff --check
      - name: Commit Rust source formatting only to development branch
        shell: bash
        run: |
          git config user.name "PortaWeave Engineering"
          git config user.email "portaweave-engineering@users.noreply.github.com"
          git add crates/core/src/volume.rs crates/native-bridge/src/lib.rs crates/native-bridge/tests/abi.rs
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --stat
          git commit -m "style(native): rustfmt generated files"
          git push origin HEAD:refs/heads/codex/m0-native-abi-20261024
