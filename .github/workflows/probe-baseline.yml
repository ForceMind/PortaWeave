name: Probe harness on native host directories (not PortaWeave mounts)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harness:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate harness and safe failure behavior
        run: python -m unittest discover -s tests -v
      - name: Probe a native host directory, never claim this is a mounted container
        shell: bash
        run: python tools/workspace_probe.py --root "$RUNNER_TEMP" --label "native-host-${{ runner.os }}" --cases io,mmap,replace,hardlink,names,exclusive,sqlite,git,windows-share,windows-lock,windows-delete,windows-replace --report "host-${{ runner.os }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-probe-${{ runner.os }}
          path: host-*.json
          if-no-files-found: warn
