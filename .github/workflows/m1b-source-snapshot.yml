name: M1-B source snapshot (temporary, read-only)
on:
  push:
    branches: [codex/m1b-recovery-safety-20261024]
    paths: [.github/workflows/m1b-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=zip -o "$RUNNER_TEMP/portaweave-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: m1b-source-snapshot
          path: ${{ runner.temp }}/portaweave-source.zip
          retention-days: 1
