name: Same experimental container across OS runners (not exFAT or mounts)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo run --locked -p portaweave-core --example interop -- handover-lab seed
      - run: cargo run --locked -p portaweave-core --example metadata_handover -- metadata-lab seed
      - uses: actions/upload-artifact@v4
        with:
          name: handover-seed
          path: handover-lab/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: metadata-seed
          path: metadata-lab/
          if-no-files-found: error
  macos:
    needs: seed
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: handover-seed
          path: handover-lab
      - uses: actions/download-artifact@v4
        with:
          name: metadata-seed
          path: metadata-lab
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo run --locked -p portaweave-core --example interop -- handover-lab macos
      - run: cargo run --locked -p portaweave-core --example metadata_handover -- metadata-lab macos
      - uses: actions/upload-artifact@v4
        with:
          name: handover-after-macos
          path: handover-lab/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: metadata-after-macos
          path: metadata-lab/
          if-no-files-found: error
  windows:
    needs: macos
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: handover-after-macos
          path: handover-lab
      - uses: actions/download-artifact@v4
        with:
          name: metadata-after-macos
          path: metadata-lab
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo run --locked -p portaweave-core --example interop -- handover-lab windows
      - run: cargo run --locked -p portaweave-core --example metadata_handover -- metadata-lab windows
      - uses: actions/upload-artifact@v4
        with:
          name: handover-after-windows
          path: handover-lab/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: metadata-after-windows
          path: metadata-lab/
          if-no-files-found: error
  verify-return:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: handover-after-windows
          path: handover-lab
      - uses: actions/download-artifact@v4
        with:
          name: metadata-after-windows
          path: metadata-lab
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo run --locked -p portaweave-core --example interop -- handover-lab verify
      - run: cargo run --locked -p portaweave-core --example metadata_handover -- metadata-lab verify
      - name: Export returned container without changing its bytes
        shell: python
        run: |
          from pathlib import Path
          import hashlib, os, subprocess
          source = Path('handover-lab')
          def hashes():
              return {str(p.relative_to(source)): hashlib.sha256(p.read_bytes()).hexdigest() for p in source.rglob('*') if p.is_file()}
          before = hashes()
          subprocess.run(['cargo','run','--locked','-p','portaweave-core','--bin','portaweave-recover','--','export',str(source),'handover-recovery','handover-export'], check=True)
          assert hashes() == before, 'offline export changed the original container'
          out = Path('handover-export/files')
          assert (out/'stage').read_bytes() == bytes([2])
          data = bytearray([2]) * (65536 * 4 + 7)
          label = '跨系统文件内容 / portable bytes'.encode()
          data[:len(label)] = label
          assert (out/'项目/SOURCE.BIN').read_bytes() == data
          assert os.path.samefile(out/'项目/SOURCE.BIN',out/'项目/source-alias.bin')
          assert Path('handover-export/COMPLETE').is_file()
          assert not Path('handover-export/INCOMPLETE').exists()
          print('Returned-container content export and original SHA-256 preservation verified')
          source = Path('metadata-lab')
          before = hashes()
          subprocess.run(['cargo','run','--locked','-p','portaweave-core','--bin','portaweave-recover','--','export',str(source),'metadata-recovery','metadata-export'], check=True)
          assert hashes() == before, 'v2 recovery changed the original container'
          out = Path('metadata-export/files')
          assert (out/'CODE').read_bytes() == b'stage-2'
          assert os.path.samefile(out/'CODE', out/'alias')
          assert Path('metadata-export/COMPLETE').is_file()
          assert 'POSIX modes, uid/gid' in Path('metadata-export/report.txt').read_text()
          print('Returned v2 recovery, content links and original SHA-256 preservation verified')
      - uses: actions/upload-artifact@v4
        with:
          name: handover-return-verified
          path: |
            handover-lab/
            handover-export/report.txt
            handover-recovery/snapshot-manifest.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: metadata-return-verified
          path: |
            metadata-lab/
            metadata-export/report.txt
            metadata-recovery/snapshot-manifest.txt
          if-no-files-found: error
