name: Actual C caller of experimental native ABI (not an OS mount)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c-smoke:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned compiler
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build the C-compatible Rust shared library
        run: cargo build --locked -p portaweave-native
      - name: Compile a real C executable against its public header
        shell: bash
        run: cc -std=c11 -Wall -Wextra -Werror -Iinclude tools/native_abi_smoke.c -Ltarget/debug -lportaweave_native -o target/debug/native_abi_smoke
      - name: Run C caller in a disposable native-host directory
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$PWD/target/debug"
          export DYLD_LIBRARY_PATH="$PWD/target/debug"
          target/debug/native_abi_smoke "$RUNNER_TEMP/portaweave-c-smoke-$GITHUB_RUN_ID"
