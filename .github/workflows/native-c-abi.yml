name: Actual C/Swift callers of experimental native ABI (not an OS mount)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-interop:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned compiler
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build the C-compatible Rust shared library
        run: cargo build --locked -p portaweave-native
      - name: Compile a real C executable against its public header (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cc -std=c11 -Wall -Wextra -Werror -Iinclude tools/native_abi_smoke.c -Ltarget/debug -lportaweave_native -o target/debug/native_abi_smoke
      - name: Run native C caller (Unix disposable directory)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$PWD/target/debug"
          export DYLD_LIBRARY_PATH="$PWD/target/debug"
          target/debug/native_abi_smoke "$RUNNER_TEMP/portaweave-c-smoke-$GITHUB_RUN_ID"
      - name: Compile and run real MSVC C caller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/run-native-abi-windows.ps1
      - uses: actions/checkout@v4
        if: runner.os == 'Windows'
        with:
          repository: winfsp/winfsp
          ref: ddca7bd5481857a65ba552f643b8776fd070836f
          path: build-deps/winfsp
          persist-credentials: false
      - name: Type-check WinFsp 2.1 real callback signatures and exercise fail-closed contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/run-winfsp-contract-windows.ps1
      - name: Compile WinFsp dispatcher lifecycle and validate safe refusal (no mount)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/run-winfsp-service-build-windows.ps1
      - name: Record installed WinFsp runtime and driver prerequisites without changing them
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/probe-windows-mount-environment.ps1
      - name: Preserve Windows mount environment inventory
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-mount-environment
          path: target/windows-mount-environment.json
          if-no-files-found: error
      - name: Validate FSKit unary extension Swift types and metadata (no signing/mount)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -parse-as-library -typecheck -warnings-as-errors -I include -framework FSKit \
            platform/macos/FSKitExtension/PortaWeaveFSKitExtension.swift \
            platform/macos/FSKitExtension/PortaWeaveUnaryFileSystem.swift
          plutil -lint platform/macos/FSKitExtension/Info.plist
          plutil -lint platform/macos/FSKitExtension/PortaWeaveFSKitExtension.entitlements
          test "$(/usr/libexec/PlistBuddy -c 'Print :EXAppExtensionAttributes:FSShortName' platform/macos/FSKitExtension/Info.plist)" = portaweave
      - name: Build and run Swift caller with macOS FSKit SDK available
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -I include -L target/debug -lportaweave_native -framework FSKit platform/macos/NativeBridgeSmoke.swift -o "$RUNNER_TEMP/portaweave-swift-abi"
          DYLD_LIBRARY_PATH="$PWD/target/debug" "$RUNNER_TEMP/portaweave-swift-abi" "$RUNNER_TEMP/portaweave-swift-c-smoke-$GITHUB_RUN_ID"
      - name: Build and exercise FSVolume operations with actual SDK objects (no OS mount)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -parse-as-library -warnings-as-errors -I include -L target/debug -lportaweave_native -framework FSKit \
            platform/macos/FSKitExtension/PortaWeaveVolumeSession.swift \
            platform/macos/FSKitExtension/PortaWeaveVolume.swift \
            platform/macos/FSVolumeContract.swift -o "$RUNNER_TEMP/portaweave-fsvolume-contract"
          DYLD_LIBRARY_PATH="$PWD/target/debug" "$RUNNER_TEMP/portaweave-fsvolume-contract" "$RUNNER_TEMP/portaweave-fsvolume-$GITHUB_RUN_ID"
      - name: Fetch the exact pre-v3 reader source (read-only)
        uses: actions/checkout@v4
        with:
          ref: a578785591976e9d71658dc5b93bf1c234c9db7f
          path: build-deps/v2-reader
          persist-credentials: false
      - name: Build actual old reader separately and verify v3 refusal without mutation
        shell: python
        run: |
          import subprocess
          old = 'build-deps/v2-reader'
          assert subprocess.check_output(['git','-C',old,'rev-parse','HEAD'], text=True).strip() == 'a578785591976e9d71658dc5b93bf1c234c9db7f'
          subprocess.run(['cargo','build','--locked','--manifest-path',old+'/Cargo.toml','-p','portaweave-native','--target-dir','target/v2-reader'], check=True)
          subprocess.run(['cargo','run','--locked','-p','portaweave-core','--example','directory_handover','--','target/v3-old-reader-fixture','seed'], check=True)
          subprocess.run(['python','tools/old_reader_guard.py',old,'target/v2-reader/debug','target/v3-old-reader-fixture'], check=True)
