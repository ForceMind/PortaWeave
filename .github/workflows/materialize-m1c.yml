name: One-shot M1-C branch materialization (remove before merge)
on:
  push:
    branches: [codex/m1c-space-safety-20261024]
permissions:
  contents: read
jobs:
  materialize:
    if: "!startsWith(github.event.head_commit.message, 'build: materialize M1-C')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Verify exact branch tip and apply bounded edit
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/codex/m1c-space-safety-20261024"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .ci/materialize_m1c.py
      - name: Materialize dependency lock and formatting with pinned compiler
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          cargo +1.99.1 fmt --all
          cargo +1.99.1 check --workspace --all-features
      - name: Commit only reviewed source scope to this branch, never force push
        shell: bash
        run: |
          git config user.name 'PortaWeave Engineering'
          git config user.email 'portaweave-engineering@users.noreply.github.com'
          git add Cargo.toml Cargo.lock crates/core .github/workflows/rust-core.yml
          git diff --cached --stat
          git commit -m 'build: materialize M1-C space admission and backing-I/O safety'
          git push origin HEAD:refs/heads/codex/m1c-space-safety-20261024
